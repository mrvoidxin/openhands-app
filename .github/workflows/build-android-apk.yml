name: Build Android APK

# Builds the Capacitor-wrapped web app into a signed Android APK.
# On a tag push (v*) the APK is attached to the GitHub Release, which gives a
# permanent, always-available download URL.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "OpenHands-main/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenHands-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: OpenHands-main/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor toolchain
        # The Capacitor packages are not in package.json; install them at the
        # same major version the android/ project was generated with.
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web bundle
        env:
          # Public URL of the OpenHands agent server the phone talks to.
          # Set repo variable BACKEND_BASE_URL to bake it in; leave unset to
          # let the user enter it in the app on first launch.
          VITE_BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          VITE_MOCK_API: "false"
        run: npm run build:app

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "using keystore from secrets"
          elif [ -f android/app/release.keystore ]; then
            echo "using keystore committed in the repo"
          else
            echo "::warning::no keystore found; release build will be unsigned"
          fi

      - name: Build release APK
        working-directory: OpenHands-main/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        working-directory: OpenHands-main/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Show APK details
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          md5sum "$APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" 2>/dev/null \
              | grep -E "^package|application-label" || true
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhands-release-apk
          path: OpenHands-main/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhands-debug-apk
          path: OpenHands-main/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APKs to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "OpenHands Mobile $TAG" \
            --notes "Android build of the OpenHands Agent Canvas UI, packaged with Capacitor."
          gh release upload "$TAG" \
            android/app/build/outputs/apk/release/app-release.apk#app-release.apk \
            android/app/build/outputs/apk/debug/app-debug.apk#app-debug.apk \
            --clobber
