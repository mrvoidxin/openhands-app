name: Build Android APK

# Builds the Capacitor-wrapped web app into a signed Android APK.
# On a tag push (v*) the release APK is attached to the GitHub Release, which
# gives a permanent, always-available download URL.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the release.keystore (PKCS12/JKS)
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_PASSWORD       key password
#   ANDROID_KEY_ALIAS          key alias (defaults to "openhands")
#
# Optional repository variable:
#   BACKEND_BASE_URL           baked into the web bundle as VITE_BACKEND_BASE_URL

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "OpenHands-main/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenHands-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: OpenHands-main/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor toolchain
        # The Capacitor packages are not in package.json; install them at the
        # same major version the android/ project was generated with.
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web bundle
        env:
          # Public URL of the OpenHands agent server the phone talks to.
          # Set repo variable BACKEND_BASE_URL to bake it in; leave unset to
          # let the user enter it in the app on first launch.
          VITE_BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          VITE_MOCK_API: "false"
        run: npm run build:app

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Without the secret the build is unsigned, so it must never be
            # published. The publish step below is gated on this output, which
            # keeps a branch/PR run green while still refusing to ship an
            # unsigned APK.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the APK will be UNSIGNED and will not be published."
            echo "::warning::Add the signing secrets (see README, section 'Signing') to publish releases."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "keystore restored: $(wc -c < android/app/release.keystore) bytes"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: OpenHands-main/android
        env:
          OPENHANDS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENHANDS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OPENHANDS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        working-directory: OpenHands-main/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify the release APK
        working-directory: OpenHands-main/android
        env:
          KEYSTORE_WAS_RESTORED: ${{ steps.keystore.outputs.signed }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no release APK was produced"
            exit 1
          fi
          echo "apk: $APK"

          # apksigner is a shell wrapper that execs `java`, so the JDK has to be
          # on PATH - JAVA_HOME alone is not enough and the check silently fails.
          export PATH="$JAVA_HOME/bin:$PATH"

          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)

          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "^package" || true
          fi

          certs=""
          if [ -n "$APKSIGNER" ]; then
            certs=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          fi
          if ! printf '%s' "$certs" | grep -q "Signer #1"; then
            # keytool also reads a v1-signed APK, so use it as a fallback.
            certs=$(keytool -printcert -jarfile "$APK" 2>&1 || true)
          fi
          printf '%s\n' "$certs" |
            grep -E "Signer #1 certificate (DN|SHA-256)|^Certificate fingerprints|SHA256:" || true

          if printf '%s' "$certs" | grep -qE "Signer #1 certificate|SHA256:"; then
            echo "release APK is signed"
          elif [ "$KEYSTORE_WAS_RESTORED" = "true" ]; then
            echo "::error::the keystore was restored but the release APK is not signed"
            exit 1
          else
            echo "::warning::release APK is UNSIGNED (no keystore secret) - not publishable"
          fi

          # The signing key must never change. Two APKs signed with different
          # keys are different apps to Android, so a rotated key forces every
          # user to uninstall first. Pin the fingerprint and refuse to publish
          # anything else. The fingerprint is public - it ships inside every
          # APK - so it is safe to keep in the repository. Override with the
          # SIGNING_CERT_SHA256 variable only when rotating on purpose.
          EXPECTED="${{ vars.SIGNING_CERT_SHA256 }}"
          if [ -z "$EXPECTED" ]; then
            EXPECTED="0D:96:FA:45:8C:34:42:D2:28:AC:C8:56:97:04:10:4A:4E:83:44:3A:68:0E:DF:81:C6:AE:0D:D1:6D:DA:81:12"
          fi

          if [ "$KEYSTORE_WAS_RESTORED" = "true" ]; then
            # apksigner prints the digest as bare hex, keytool as hex separated
            # by colons. Accept either, then normalise to the colons form.
            RAW=$(printf '%s' "$certs" | grep -oE '([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}|[0-9A-Fa-f]{64}' | head -1)
            if [ -z "$RAW" ]; then
              echo "::error::could not read the signer fingerprint from the APK"
              exit 1
            fi
            ACTUAL=$(printf '%s' "$RAW" | tr -d ':' | tr 'a-f' 'A-F' | sed 's/\(..\)/\1:/g; s/:$//')
            echo "signer fingerprint : $ACTUAL"
            echo "expected fingerprint: $EXPECTED"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::SIGNING KEY CHANGED. The APK is signed with a different key than the pinned fingerprint. Publishing this would force every existing user to uninstall. If the rotation is intentional, update SIGNING.md and set the SIGNING_CERT_SHA256 repository variable."
              exit 1
            fi
            echo "signing key matches the pinned fingerprint - in-place updates stay possible"
          fi

          sha256sum "$APK"
          ls -l "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhands-release-apk
          path: OpenHands-main/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhands-debug-apk
          path: OpenHands-main/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach the release APK to the GitHub Release
        # Only a signed release APK is published, and only from a v* tag. The
        # debug build stays a workflow artifact (login required) because it is
        # debuggable. Gating on `signed` means an unsigned APK can never be
        # published, however the workflow is triggered.
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "OpenHands Mobile $TAG" \
            --notes "Android build of the OpenHands Agent Canvas UI, packaged with Capacitor."
          gh release upload "$TAG" \
            android/app/build/outputs/apk/release/app-release.apk#app-release.apk \
            --clobber
