name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web app
        env:
          # Public URL of your running OpenHands agent server (https, reachable from phone)
          VITE_BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          VITE_MOCK_API: "false"
        run: npm run build:app

      - name: Add Capacitor Android project
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: openhands-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
